{
  "experiment": {
    "name": "stad_smoke",
    "output_dir": "outputs/stad_smoke"
  },
  "seed": 7,
  "data": {
    "source_dir": "dataset/localizeMI_unprocessed",
    "num_workers": 0,
    "scales": [4],
    "split": {
      "ratios": [0.8, 0.1, 0.1],
      "seed": 7
    }
  },
  "model": {
    "mae": {
      "in_chans": 256,
      "time_steps": 1280,
      "patch_size": 32,
      "embed_dim": 64,
      "depth": 2,
      "num_heads": 4,
      "decoder_embed_dim": 32,
      "decoder_depth": 1,
      "decoder_num_heads": 4,
      "mlp_ratio": 2.0,
      "norm_pix_loss": false,
      "pretrained_checkpoint_path": null,
      "pretrained_checkpoint_url": null
    },
    "stc": {
      "patch_size": 32,
      "time_steps": 1280,
      "d_model": 64,
      "depth": 2,
      "num_heads": 4,
      "mlp_ratio": 2.0,
      "position_dim": 3
    },
    "mtd": {
      "sequence_length": 40,
      "d_model": 64,
      "num_blocks": 2,
      "num_heads": 4,
      "mlp_ratio": 2.0,
      "conv_kernels": [3, 5],
      "dropout": 0.0
    },
    "diffusion": {
      "timesteps": 32,
      "beta_schedule": "cosine"
    }
  },
  "train": {
    "device": "cpu",
    "batch_size": 2,
    "epochs": 1,
    "lr": 0.0002,
    "weight_decay": 0.01,
    "grad_clip": 1.0,
    "mae_mask_ratio": 0.5,
    "freeze_mae": true
  },
  "eval": {
    "batch_size": 2,
    "sample_steps": 8
  },
  "paths": {
    "mae_checkpoint": "checkpoints/mae_smoke.pt",
    "stad_checkpoint": "checkpoints/stad_smoke.pt"
  }
}
